<button
  type="button"
  nz-tooltip
  [nzTooltipMouseEnterDelay]="0.75"
  [nzTooltipTitle]="tooltipTitle()"
  [attr.aria-label]="tooltipTitle()"
  [attr.aria-pressed]="hasFavorite()"
  nz-button
  (click)="hasFavorite() ? remove($event) : add($event)"
>
  @if (hasFavorite()) {
    <span nz-icon nzType="star" nzTheme="twotone" nzTwotoneColor="#FFD700"></span>
  } @else {
    <span nz-icon nzType="star"></span>
  }
</button>
