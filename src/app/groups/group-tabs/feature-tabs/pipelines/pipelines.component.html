<div class="flex flex-col gap-2 w-full">

  <!-- FILTER ROW -->
  <div class="flex justify-between items-center w-full">

    <!-- LEFT FILTERS -->
    <div class="flex flex-nowrap gap-3 items-center overflow-x-auto">

      <!-- PROJECT FILTER -->
      <gcd-project-filter
        [projects]="projects()"
        [(filterText)]="filterTextProject"
      ></gcd-project-filter>

      <!-- GROUP FILTER -->
      <gcd-text-filter
        [(filterText)]="filterGroup"
        [placeholder]="'Search groups...'"
      ></gcd-text-filter>

      <!-- BRANCH FILTER -->
      <gcd-branch-filter
        [branches]="branches()"
        [(filterText)]="filterTextBranch"
      ></gcd-branch-filter>

      <!-- TRIGGER FILTER -->
      <gcd-text-filter
        [(filterText)]="filterTrigger"
        [placeholder]="'Search triggers...'"
      ></gcd-text-filter>

      <!-- STATUS FILTER -->
      <gcd-text-filter
        [(filterText)]="filterStatus"
        [placeholder]="'Search status...'"
      ></gcd-text-filter>

      <!-- TOPIC FILTER -->
      <gcd-topic-filter
        [loading]="loading()"
        [projects]="projects()"
        [(filterTopics)]="filterTopics"
      ></gcd-topic-filter>

    </div>

    <!-- EXPORT BUTTON -->
    <button nz-button nzType="default" (click)="exportCsv()">
      Export CSV
    </button>

  </div>

  <!-- TABLE -->
  @if (loading()) {
    <nz-spin />
  } @else {
    <gcd-pipeline-table
      [projectPipelines]="filteredProjectPipelines()"
      [(pinnedPipelines)]="pinnedPipelines"
    />
  }

</div>
