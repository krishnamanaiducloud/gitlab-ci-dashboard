<div class="latest-pipelines">
  <section class="filter-card filter-card--jobs">
    <span class="filter-label">Failed jobs</span>
    <div class="filter-chip-row">
      <gcd-job-filter
        [loading]="loading()"
        [jobs]="jobs()"
        [filterJobs]="filterJobs()"
        (filterJobsChange)="onFilterJobsChanged($event)"
      ></gcd-job-filter>
    </div>
  </section>

  <section class="toolbar-card">
    <div class="filter-grid">
      <gcd-project-filter
        [projects]="projects()"
        [filterText]="filterProject()"
        (filterTextChange)="onFilterProjectChanged($event)"
      ></gcd-project-filter>

      <gcd-text-filter
        [filterText]="filterGroup()"
        placeholder="Search groups..."
        (filterTextChange)="onFilterGroupChanged($event)"
      ></gcd-text-filter>

      <gcd-text-filter
        [filterText]="filterBranch()"
        placeholder="Search branches..."
        (filterTextChange)="onFilterBranchChanged($event)"
      ></gcd-text-filter>

      <gcd-text-filter
        [filterText]="filterTrigger()"
        placeholder="Search triggers..."
        (filterTextChange)="onFilterTriggerChanged($event)"
      ></gcd-text-filter>
    </div>

    <div class="toolbar-actions">
      <gcd-topic-filter
        [loading]="loading()"
        [projects]="projects()"
        [filterTopics]="filterTopics()"
        (filterTopicsChange)="onFilterTopicsChanged($event)"
      ></gcd-topic-filter>

      <button class="export-button" nz-button nzType="primary" (click)="exportCsv()">
        <span nz-icon nzType="download"></span>
        Export CSV
      </button>
    </div>
  </section>

  <section class="table-card">
    @if (loading()) {
      <div class="table-loading">
        <nz-spin />
      </div>
    } @else {
      <gcd-pipeline-status-tabs
        [projectPipelines]="projectPipelines()"
        [filterProject]="filterProject()"
        [filterGroup]="filterGroup()"
        [filterBranch]="filterBranch()"
        [filterTrigger]="filterTrigger()"
        [filterTopics]="filterTopics()"
        [filterJobs]="filterJobs()"
        [filterText]="filterProject()"
      >
      </gcd-pipeline-status-tabs>
    }
  </section>
</div>
