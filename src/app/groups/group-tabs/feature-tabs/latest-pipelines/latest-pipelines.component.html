<div class="flex flex-col gap-1 w-full">

  <!-- FILTER BY ROW -->
  <div class="filter-by-container flex items-center gap-050">
    <span class="filter-label font-sm">
      Filter by
    </span>
    <div class="flex flex-nowrap items-center gap-050 overflow-x-auto">
      <gcd-job-filter
        [loading]="loading()"
        [jobs]="jobs()"
        [(filterJobs)]="filterJobs"
      ></gcd-job-filter>
    </div>
  </div>

  <!-- TOP FILTER ROW -->
  <div class="flex justify-between items-center w-full">

    <!-- LEFT SIDE FILTERS -->
    <div class="flex flex-nowrap gap-050 items-center overflow-x-auto">

      <!-- PROJECT FILTER -->
      <gcd-project-filter
        [projects]="projects()"
        [(filterText)]="filterProject"
      ></gcd-project-filter>

      <!-- GROUP FILTER -->
      <gcd-text-filter
        [(filterText)]="filterGroup"
        [placeholder]="'Search groups...'"
      ></gcd-text-filter>

      <!-- BRANCH FILTER -->
      <gcd-text-filter
        [(filterText)]="filterBranch"
        [placeholder]="'Search branches...'"
      ></gcd-text-filter>

      <!-- TRIGGER FILTER -->
      <gcd-text-filter
        [(filterText)]="filterTrigger"
        [placeholder]="'Search triggers...'"
      ></gcd-text-filter>

      <!-- TOPIC FILTER -->
      <gcd-topic-filter
        [loading]="loading()"
        [projects]="projects()"
        [(filterTopics)]="filterTopics"
      ></gcd-topic-filter>

    </div>

    <!-- RIGHT SIDE CSV BUTTON -->
    <button nz-button nzType="default" (click)="exportCsv()">
      Export CSV
    </button>

  </div>

  <!-- TABLE SECTION -->
  @if (loading()) {
    <nz-spin />
  } @else {
    <gcd-pipeline-status-tabs
      [projectPipelines]="projectPipelines()"
      [filterProject]="filterProject()"
      [filterGroup]="filterGroup()"
      [filterBranch]="filterBranch()"
      [filterTrigger]="filterTrigger()"
      [filterTopics]="filterTopics()"
      [filterJobs]="filterJobs()"
      [filterText]="filterProject()"
    ></gcd-pipeline-status-tabs>
  }

</div>
