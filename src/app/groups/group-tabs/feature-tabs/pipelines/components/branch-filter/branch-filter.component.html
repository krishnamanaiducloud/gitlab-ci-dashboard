<div class="flex flex-col gap-1">
  <div class="flex items-center">
    <div class="max-width-275">
      <nz-input-group [nzSuffix]="suffixIcon">
        <input
          type="text"
          [(ngModel)]="filterText"
          nz-input
          aria-label="Filter branches"
          [placeholder]="branchCount() > 0 ? 'Search ' + branchCount() + ' branches...' : 'Search branches...'"
        />
      </nz-input-group>
      <ng-template #suffixIcon>
        <button
          type="button"
          class="icon-button pointer"
          nz-icon
          nzType="close-square"
          nz-tooltip
          [nzTooltipMouseEnterDelay]="1"
          nzTooltipTitle="Clear field"
          aria-label="Clear branch filter"
          (click)="filterText.set('')"
        ></button>
      </ng-template>
    </div>
  </div>
</div>
