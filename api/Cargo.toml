[package]
name = "gcd_api"
version = "2.14.1"
edition = "2021"

[dependencies]
actix-web = "4.18.1"
actix-web-prom = { version = "0.10.0", features = ["process"] }
actix-files = { version = "0.7.2" }
actix-service = { version = "2.0.3" }
actix-http = "3.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-querystring-actix = "0.3.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.34"
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["sync"] }
async-trait = "0.1.92"
futures = "0.3.34"
toml = "1.1.8"

[dev-dependencies]
serial_test = "4.0.1"
