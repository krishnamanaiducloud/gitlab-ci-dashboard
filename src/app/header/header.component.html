<header class="header">
  <div class="brand">
    <span class="brand-icon" nz-icon nzType="laptop"></span>
    <div class="brand-copy">
      <h4 class="title">GitLab CI Dashboard</h4>
      <span>Pipeline observability and controls</span>
    </div>
  </div>
  <div class="header-actions">
    <span class="version-pill">{{ version() }}</span>
    <button
      type="button"
      class="github-button"
      nzType="text"
      nz-button
      nz-tooltip
      nzTooltipTitle="View on GitHub"
      aria-label="View project on GitHub"
      (click)="onClick()"
    >
      <span nz-icon nzType="github"></span>
    </button>
  </div>
</header>
