<div class="feature-page">
  <section class="filter-card">
    <span class="filter-label">Failed jobs</span>
    <div class="filter-chip-row">
      <gcd-job-filter
        [loading]="loading()"
        [jobs]="jobs()"
        [filterJobs]="filterJobs()"
        (filterJobsChange)="onFilterJobsChanged($event)"
      ></gcd-job-filter>
    </div>
  </section>

  <section class="toolbar-card">
    <div class="filter-grid">
      <gcd-project-filter
        [projects]="projects()"
        [filterText]="filterText()"
        (filterTextChange)="onFilterTextChanged($event)"
      ></gcd-project-filter>

      <gcd-text-filter
        [filterText]="filterGroup()"
        placeholder="Search groups..."
        (filterTextChange)="onFilterGroupChanged($event)"
      ></gcd-text-filter>

      <gcd-text-filter
        [filterText]="filterBranch()"
        placeholder="Search branches..."
        (filterTextChange)="onFilterBranchChanged($event)"
      ></gcd-text-filter>

      <gcd-text-filter
        [filterText]="filterTrigger()"
        placeholder="Search triggers..."
        (filterTextChange)="onFilterTriggerChanged($event)"
      ></gcd-text-filter>

      <gcd-text-filter
        [filterText]="filterStatus()"
        placeholder="Search status..."
        (filterTextChange)="onFilterStatusChanged($event)"
      ></gcd-text-filter>
    </div>

    <div class="toolbar-actions">
      <gcd-topic-filter
        [loading]="loading()"
        [projects]="projects()"
        [filterTopics]="filterTopics()"
        (filterTopicsChange)="onFilterTopicsChanged($event)"
      ></gcd-topic-filter>

      <button class="export-button" nz-button nzType="primary" (click)="exportCsv()">
        <span nz-icon nzType="download"></span>
        Export CSV
      </button>
    </div>
  </section>

  <section class="table-card">
    @if (loading()) {
      <div class="table-loading">
        <nz-spin />
      </div>
    } @else {
      <gcd-schedule-table [schedulePipelines]="filteredSchedulePipelines()"></gcd-schedule-table>
    }
  </section>
</div>
