<div class="flex items-center">
  <div class="max-width-275">
    <nz-input-wrapper>
      <input
        type="text"
        [(ngModel)]="filterText"
        nz-input
        aria-label="Filter projects"
        [placeholder]="projectCount() > 0 ? 'Search ' + projectCount() + ' projects...' : 'Search projects...'"
      />
      <button
        nzInputSuffix
        type="button"
        class="icon-button pointer"
        nz-icon
        nzType="close-square"
        nz-tooltip
        [nzTooltipMouseEnterDelay]="1"
        nzTooltipTitle="Clear field"
        aria-label="Clear project filter"
        (click)="filterText.set('')"
      ></button>
    </nz-input-wrapper>
  </div>
</div>
